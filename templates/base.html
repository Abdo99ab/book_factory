<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Book Factory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@600&family=Luckiest+Guy&family=Merriweather:wght@700&family=Montserrat:wght@700&family=Nunito:wght@700&family=Patrick+Hand&family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Book Factory</a>
    <nav>
      <a href="{{ url_for('create_form') }}">New book</a>
      <a href="{{ url_for('template_list') }}">Templates</a>
      <a href="{{ url_for('archived_jobs') }}">Archive</a>
      <a href="{{ url_for('memory_page') }}">Learned prefs</a>
    </nav>
  </header>
  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Raised Ready — New book</title>
  <style>
    body { font-family: Georgia, serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #22324A; background: #FAF6EF; }
    label { display: block; margin-top: 0.9rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; background: #22324A; color: #F3EBDD; border: 0; padding: 0.75rem 1.25rem; cursor: pointer; }
    .flash { padding: 0.75rem; background: #F3EBDD; margin-bottom: 1rem; }
    .err { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>New book</h1>
  <p><a href="{{ url_for('list_jobs') }}">Jobs</a></p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {% if cat == 'error' %}err{% endif %}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('create_job') }}" enctype="multipart/form-data">
    <label>Title
      <select name="title_id" required>
        {% for t in titles %}
        <option value="{{ t.title_id }}">{{ t.band }} — {{ t.title_template }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Child name <input name="name" required></label>
    <label>Age <input name="age" required></label>
    <label>Pronouns
      <select name="pronouns" required>
        <option value="she">she</option>
        <option value="he">he</option>
        <option value="they">they</option>
      </select>
    </label>
    <label>Carer name <input name="carer_name" required></label>
    <label>Carer role <input name="carer_role" required placeholder="Mum / Dad / Nana…"></label>
    <label>Home type
      <select name="home_type">
        <option value="house">house</option>
        <option value="flat">flat</option>
      </select>
    </label>
    <label>Comfort object <input name="comfort_object" required></label>
    <label>Order ID <input name="order_id" required pattern="[A-Za-z0-9-]+"></label>
    <label>Dedication (optional) <textarea name="dedication_text" rows="2"></textarea></label>
    <label>Child photo <input type="file" name="reference_image" accept="image/*" required></label>
    <p style="font-size:0.9rem;opacity:0.8">Extra slots (if the title needs them) can be typed below after choosing a title that lists them on the catalogue — for now use optional free fields:</p>
    <label>Slot: school_name <input name="slot_school_name"></label>
    <label>Slot: sibling_friend <input name="slot_sibling_friend"></label>
    <label>Slot: potty_or_seat <input name="slot_potty_or_seat" placeholder="potty / toilet seat"></label>
    <label>Slot: underwear <input name="slot_underwear"></label>
    <button type="submit">Create — generate manuscript + character</button>
  </form>
</body>
</html>
